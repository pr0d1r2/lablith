[package]
name = "lablith"
# Unpublished until the first release (T38).
version = "0.0.0"
edition = "2024"
# The fleet pin: nixpkgs-lock (nixos-26.05) carries rustc 1.95.
rust-version = "1.95"
license = "MIT"
description = "Materialize GitLab CI pipelines from a small config"
repository = "https://github.com/pr0d1r2/lablith"
readme = "README.md"
keywords = ["gitlab-ci", "ci", "pipeline", "generator", "nix"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "lablith"
path = "src/main.rs"

[dependencies]
# The forge-neutral core lablith shares with actlith: registry, YAML
# writer, drift check, kind catalogue, systems, detect (SPEC.md C).
# From crates.io, never a git pin: crates.io refuses to publish a crate
# with a git dependency. Only src/core names it (V3).
pipelith = "0.1.1"

[lints.rust]
# No FFI anywhere, so no module needs to lift it (SPEC.md C).
unsafe_code = "forbid"
unreachable_pub = "deny"

# Code limits (SPEC.md C), thresholds in clippy.toml; the fleet deny list.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
